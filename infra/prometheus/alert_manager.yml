global:
  resolve_timeout: 5m

route:
  receiver: mediflow-ops
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: mediflow-ops
    webhook_configs:
      - url: http://backend:8000/api/ops/webhook/prometheus
        send_resolved: false
        http_config:
          headers:
            X-Alertmanager-Token: ""
