global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mediflow_backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: mediflow_ml
    metrics_path: /metrics
    static_configs:
      - targets:
          - ml_service:8001