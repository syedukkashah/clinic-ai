name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_ml_service:
        description: "Also deploy the ML service profile"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ec2-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR || '~/clinic-ai' }}
          DEPLOY_ML_SERVICE: ${{ github.event.inputs.deploy_ml_service || secrets.DEPLOY_ML_SERVICE || 'false' }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            APP_DIR="$APP_DIR" \
            DEPLOY_ML_SERVICE="$DEPLOY_ML_SERVICE" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="${APP_DIR/#\~/$HOME}"
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          test -f .env
          docker compose -f docker-compose.backend.yml config --quiet

          docker compose -f docker-compose.backend.yml run --rm api alembic upgrade head
          docker compose -f docker-compose.backend.yml run --rm api python services/rag_service.py --ingest
          docker compose -f docker-compose.backend.yml up -d --build redis api celery_worker celery_beat

          if [ "$DEPLOY_ML_SERVICE" = "true" ]; then
            docker compose -f docker-compose.backend.yml --profile ml up -d --build ml_service
          fi

          docker compose -f docker-compose.backend.yml ps
          docker image prune -f
          REMOTE
