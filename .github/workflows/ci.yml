      - name: Run ops agent tests
        env:
          PYTHONPATH: .
          ML_SERVICE_URL: "http://localhost:8001"
          GROQ_API_KEYS: test-groq-key-1
          GEMINI_API_KEYS: test-gemini-key-1
          MISTRAL_API_KEYS: test-mistral-key-1
          PROMETHEUS_URL: "http://localhost:9090"
          ALERTMANAGER_WEBHOOK_TOKEN: ""
        run: python -m pytest -v tests/test_ops_agent.py

  mlops-validation:
    name: MLOps & MLflow Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install setuptools
        run: pip install "setuptools<70"

      - name: Install ML Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_service/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run ML Service MLOps Tests
        env:
          PYTHONPATH: ml_service
          MLFLOW_TRACKING_URI: "sqlite:///ml_service/mlflow_test.db"
        run: python -m pytest -v ml_service/tests/test_mlflow_logic.py ml_service/tests/test_ml_service.py

      - name: Run full ML Service regression suite
        env:
          PYTHONPATH: ml_service
          MLFLOW_TRACKING_URI: "sqlite:///ml_service/mlflow_test.db"
        run: python -m pytest -v ml_service/tests

      - name: Install Backend MLOps Dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install respx aiosqlite setuptools

      - name: Run Backend MLOps Tests
        env:
          PYTHONPATH: backend
          INTERNAL_SECRET: test_secret
          ASYNC_TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest -v backend/tests/test_drift_detector.py backend/tests/test_retrain_task.py
